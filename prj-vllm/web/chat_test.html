<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vLLM streaming test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: #0f1117; color: #e6e6e6;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 18px; background: #1a1d27; border-bottom: 1px solid #2a2d3a;
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header input { background: #0f1117; border: 1px solid #2a2d3a; color: #ccc;
                 border-radius: 6px; padding: 5px 9px; font-size: 12px; }
  #base { width: 230px; } #model { width: 150px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 720px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #3b5bdb; color: #fff; }
  .bot  { align-self: flex-start; background: #1a1d27; border: 1px solid #2a2d3a; }
  .meta { align-self: center; font-size: 11px; color: #667; }
  footer { display: flex; gap: 10px; padding: 12px 18px; background: #1a1d27; border-top: 1px solid #2a2d3a; }
  footer textarea { flex: 1; background: #0f1117; border: 1px solid #2a2d3a; color: #e6e6e6;
                    border-radius: 8px; padding: 10px; resize: none; font: inherit; }
  footer button { background: #3b5bdb; color: #fff; border: 0; border-radius: 8px;
                  padding: 0 18px; font-weight: 600; cursor: pointer; }
  footer button:disabled { background: #2a2d3a; color: #666; cursor: default; }
</style>
</head>
<body>
<header>
  <strong>vLLM streaming test</strong>
  <label>base <input id="base" value="http://localhost:8000/v1" /></label>
  <label>model <input id="model" value="qwen-14b-awq" /></label>
</header>

<div id="log">
  <div class="meta">Start your local vLLM server, then send a message. Tokens stream in live.</div>
</div>

<footer>
  <textarea id="input" rows="2" placeholder="Type a message, Enter to send"></textarea>
  <button id="send">Send</button>
</footer>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [{ role: "system", content: "You are a concise, helpful assistant." }];

  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    bubble("user", text);
    history.push({ role: "user", content: text });

    const out = bubble("bot", "");
    const t0 = performance.now();
    let firstAt = null, tokens = 0;

    try {
      const resp = await fetch(document.getElementById("base").value.replace(/\/$/, "") + "/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: document.getElementById("model").value,
          messages: history,
          max_tokens: 400,
          temperature: 0.7,
          stream: true,
        }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let reply = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;
          try {
            const tok = JSON.parse(data).choices[0].delta.content || "";
            if (tok) {
              if (firstAt === null) firstAt = performance.now() - t0;
              tokens++;
              reply += tok;
              out.textContent = reply;
              log.scrollTop = log.scrollHeight;
            }
          } catch (_) { /* ignore keep-alive / partial */ }
        }
      }
      history.push({ role: "assistant", content: reply });
      const total = (performance.now() - t0) / 1000;
      bubble("meta", `TTFT ${firstAt ? firstAt.toFixed(0) : "?"} ms · ${tokens} tok · ${(tokens / total).toFixed(1)} tok/s`);
    } catch (err) {
      out.textContent = "[error] " + err.message +
        "  — is the vLLM server running, and does it allow this origin (CORS)?";
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
